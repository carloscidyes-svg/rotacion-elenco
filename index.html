/* =====================================================================

const state = {
  dates: [], matrix: {}, roster: [], availability: {},
  loaded: false, loadError: "",

  tappedBar: null,

const HISTORY_LIMIT = 25;

/* =====================================================================
   GITHUB API
   ===================================================================== */
function b64EncodeUtf8(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUtf8(str) {
  return decodeURIComponent(escape(atob(str)));
}
async function ghGetFile() {
  const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}?ref=${CONFIG.branch}`;
  const res = await fetch(url, {
    headers: { "Authorization": `token ${CONFIG.token}`, "Accept": "application/vnd.github+json" },
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("GET falló: " + res.status);
  const json = await res.json();
  state.sha = json.sha;
  const content = b64DecodeUtf8(json.content.replace(/\n/g, ""));
  return JSON.parse(content);
}
async function ghPutFile(dataObj, message) {
  const content = b64EncodeUtf8(JSON.stringify(dataObj, null, 2));
  const body = { message: message || "Actualizar datos", content, branch: CONFIG.branch };
  if (state.sha) body.sha = state.sha;
  const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`, {
    method: "PUT",
    headers: { "Authorization": `token ${CONFIG.token}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const t = await res.text().catch(() => "");
    throw new Error("PUT falló: " + res.status + " " + t);
  }
  const json = await res.json();
  state.sha = json.content.sha;
}

async function persist() {
  state.saveStatus = "saving"; render();
  try {
    await ghPutFile({ dates: state.dates, matrix: state.matrix, roster: state.roster, availability: state.availability });
    state.saveStatus = "saved"; render();
    setTimeout(() => { if (state.saveStatus === "saved") { state.saveStatus = "idle"; render(); } }, 2000);
  } catch (e) {
    console.error("No se pudo guardar", e);
    state.saveStatus = "error"; render();
    setTimeout(() => { if (state.saveStatus === "error") { state.saveStatus = "idle"; render(); } }, 4000);
  }
}

async function init() {
  try {
    const remote = await ghGetFile();
    if (remote) {
      state.dates = remote.dates || SEED_DATES;
      state.matrix = remote.matrix || SEED_MATRIX;
      state.roster = remote.roster || SEED_ROSTER;
      state.availability = remote.availability || {};
    } else {
      state.dates = SEED_DATES; state.matrix = SEED_MATRIX; state.roster = SEED_ROSTER; state.availability = SEED_AVAILABILITY;
      await ghPutFile({ dates: state.dates, matrix: state.matrix, roster: state.roster, availability: state.availability }, "Inicializar datos");
    }
  } catch (e) {
    console.error(e);
    state.loadError = e.message || String(e);
    state.dates = SEED_DATES; state.matrix = SEED_MATRIX; state.roster = SEED_ROSTER; state.availability = SEED_AVAILABILITY;
  }
  const months = [...new Set(state.dates.map(d => d.slice(0,7)))].sort();
  state.selectedMonth = months[months.length - 1] || "";
  state.loaded = true;
  render();
}

/* =====================================================================
   DESHACER / REHACER
   ===================================================================== */
function snapshot() {
  return {
    dates: JSON.parse(JSON.stringify(state.dates)),
    matrix: JSON.parse(JSON.stringify(state.matrix)),
    roster: JSON.parse(JSON.stringify(state.roster)),
    availability: JSON.parse(JSON.stringify(state.availability)),
  };
}
function applyChange(next) {
  state.history.push(snapshot());
  if (state.history.length > HISTORY_LIMIT) state.history.shift();
  state.future = [];
  state.dates = next.dates; state.matrix = next.matrix; state.roster = next.roster; state.availability = next.availability;
  render();
  persist();
}
function undo() {
  if (state.history.length === 0) return;
  const prev = state.history.pop();
  state.future.push(snapshot());
  state.dates = prev.dates; state.matrix = prev.matrix; state.roster = prev.roster; state.availability = prev.availability;
  render(); persist();
}
function redo() {
  if (state.future.length === 0) return;
  const next = state.future.pop();
  state.history.push(snapshot());
  state.dates = next.dates; state.matrix = next.matrix; state.roster = next.roster; state.availability = next.availability;
  render(); persist();
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function monthLabel(d) {
  const [y, m] = d.split("-");
  const names = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return `${names[parseInt(m,10)-1]} ${y}`;
}
function genderLabel(t) { return t === "A" ? "Hombre" : "Mujer"; }
function formatDate(d) {
  const [, m, day] = d.split("-");
  const names = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return `${parseInt(day,10)} ${names[parseInt(m,10)-1]}`;
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function getMonths() { return [...new Set(state.dates.map(d => d.slice(0,7)))].sort(); }
function getMaxMonthSessions() {
  let max = 0;
  getMonths().forEach(m => { const c = state.dates.filter(d => d.slice(0,7) === m).length; if (c > max) max = c; });
  return max || 1;
}
function getLastPastIdx() {
  const t = todayStr();
  let idx = -1;
  state.dates.forEach((d, i) => { if (d <= t) idx = i; });
  return idx;
}
function computeAlertsList(list) {
  const lastPastIdx = getLastPastIdx();
  const dates = state.dates;
  return list.map(p => {
    const vals = state.matrix[p.name] || [];
    const debutIdx = vals.findIndex(v => v !== null && v !== undefined);
    const hasPastHistory = debutIdx !== -1 && debutIdx <= lastPastIdx;
    let consecutivePlayed = 0;
    for (let i = lastPastIdx; i >= debutIdx; i--) { if (vals[i] === 1) consecutivePlayed++; else break; }
    let consecutivePlayedFull = 0;
    for (let i = dates.length - 1; i >= debutIdx; i--) { if (vals[i] === 1) consecutivePlayedFull++; else break; }
    let showsSincePlayed = 0;
    for (let i = lastPastIdx; i >= debutIdx; i--) { if (vals[i] === 1) break; showsSincePlayed++; }
    let showsSincePlayedFull = 0;
    for (let i = dates.length - 1; i >= debutIdx; i--) { if (vals[i] === 1) break; showsSincePlayedFull++; }
    let status = "ok";
    if (!hasPastHistory) status = "new";
    else if (consecutivePlayedFull >= 3) status = "cap";
    else if (showsSincePlayedFull >= 3) status = "due";
    return { name: p.name, tier: p.tier, consecutivePlayed, consecutivePlayedFull, showsSincePlayed, showsSincePlayedFull, status };
  }).sort((a,b) => {
    const order = { due: 0, cap: 1, ok: 2, new: 3 };
    return order[a.status] - order[b.status];
  });
}
function getPerformers() {
  return state.roster.filter(p => p.active && (state.tierFilter === "ALL" || p.tier === state.tierFilter));
}
function getAllActivePerformers() { return state.roster.filter(p => p.active); }
function getYearData(list) {
  return list.map(p => {
    const vals = state.matrix[p.name] || [];
    const count = vals.reduce((acc, v) => acc + (v === 1 ? 1 : 0), 0);
    return { name: p.name, value: count, tier: p.tier };
  }).sort((a,b) => b.value - a.value);
}
function getMonthlyData(list, month) {
  const idxs = state.dates.map((d,i)=>({d,i})).filter(x => x.d.slice(0,7) === month);
  return list.map(p => {
    const vals = state.matrix[p.name] || [];
    const count = idxs.reduce((acc,{i}) => acc + (vals[i] === 1 ? 1 : 0), 0);
    return { name: p.name, value: count, tier: p.tier };
  }).sort((a,b) => b.value - a.value);
}
function getUpcomingTeams() {
  const t = todayStr();
  return state.dates.map((d,i)=>({d,i})).filter(x => x.d > t).map(({d,i}) => {
    const all = getAllActivePerformers();
    const playing = all.filter(p => (state.matrix[p.name]||[])[i] === 1).map(p => p.name);
    const hosting = all.filter(p => (state.matrix[p.name]||[])[i] === 0).map(p => p.name);
    return { date: d, playing, hosting };
  }).sort((a,b) => a.date.localeCompare(b.date));
}

/* =====================================================================
   ACCIONES (todas pasan por applyChange, para deshacer/rehacer)
   ===================================================================== */
function cyclePlanCell(name, dateIdx) {
  const arr = [...(state.matrix[name] || [])];
  const cur = arr[dateIdx];
  arr[dateIdx] = (cur === null || cur === undefined) ? 1 : cur === 1 ? 0 : null;
  const nextMatrix = { ...state.matrix, [name]: arr };
  applyChange({ dates: state.dates, matrix: nextMatrix, roster: state.roster, availability: state.availability });
}
function addPlanDate() {
  const d = state.planNewDate;
  if (!d || state.dates.includes(d)) return;
  const nextDates = [...state.dates, d].sort();
  const nextMatrix = {};
  state.roster.forEach(p => {
    const oldArr = state.matrix[p.name] || [];
    const valueByDate = {};
    state.dates.forEach((dd, i) => { valueByDate[dd] = oldArr[i] !== undefined ? oldArr[i] : null; });
    valueByDate[d] = null;
    nextMatrix[p.name] = nextDates.map(dd => (valueByDate[dd] !== undefined ? valueByDate[dd] : null));
  });
  applyChange({ dates: nextDates, matrix: nextMatrix, roster: state.roster, availability: state.availability });
  state.selectedMonth = d.slice(0,7);
  state.planNewDate = "";
  state.addingPlanDate = false;
}
function deleteDate(d) {
  const idx = state.dates.indexOf(d);
  if (idx === -1) return;
  const nextDates = state.dates.filter((_,i) => i !== idx);
  const nextMatrix = {};
  Object.keys(state.matrix).forEach(name => { nextMatrix[name] = (state.matrix[name]||[]).filter((_,i) => i !== idx); });
  applyChange({ dates: nextDates, matrix: nextMatrix, roster: state.roster, availability: state.availability });
}
function toggleActive(name) {
  const nextRoster = state.roster.map(p => p.name === name ? { ...p, active: !p.active } : p);
  applyChange({ dates: state.dates, matrix: state.matrix, roster: nextRoster, availability: state.availability });
}
function toggleGender(name) {
  const nextRoster = state.roster.map(p => p.name === name ? { ...p, tier: p.tier === "A" ? "B" : "A" } : p);
  applyChange({ dates: state.dates, matrix: state.matrix, roster: nextRoster, availability: state.availability });
}
function deleteMember(name) {
  const nextRoster = state.roster.filter(p => p.name !== name);
  const nextMatrix = { ...state.matrix };
  delete nextMatrix[name];
  applyChange({ dates: state.dates, matrix: nextMatrix, roster: nextRoster, availability: state.availability });
}
function addMember() {
  const name = state.newName.trim();
  if (!name || state.roster.some(p => p.name.toLowerCase() === name.toLowerCase())) return;
  const nextRoster = [...state.roster, { name, tier: state.newTier, active: true }];
  const nextMatrix = { ...state.matrix, [name]: state.dates.map(() => null) };
  applyChange({ dates: state.dates, matrix: nextMatrix, roster: nextRoster, availability: state.availability });
  state.newName = "";
}
function cycleAvailability(date, name) {
  const dayMap = { ...(state.availability[date] || {}) };
  const cur = dayMap[name];
  if (cur === undefined) dayMap[name] = true;
  else if (cur === true) dayMap[name] = false;
  else delete dayMap[name];
  const nextAvailability = { ...state.availability, [date]: dayMap };
  applyChange({ dates: state.dates, matrix: state.matrix, roster: state.roster, availability: nextAvailability });
}

/* =====================================================================
   RENDER — tarjeta de resumen del Dashboard
   ===================================================================== */
function renderDashboard() {
  const allActive = getAllActivePerformers();
  const allAlerts = computeAlertsList(allActive);
  const yearData = getYearData(allActive);
  const monthlyData = getMonthlyData(allActive, state.selectedMonth);
  const months = getMonths();
  const todaysStr = todayStr();

  const totalShows = yearData.reduce((a,p) => a + p.value, 0);
  const avgPerPerson = yearData.length ? (totalShows / yearData.length).toFixed(1) : "0";
  const suggestedNext = allAlerts.filter(a => a.status !== "new" && a.status !== "cap")
    .sort((a,b) => b.showsSincePlayedFull - a.showsSincePlayedFull).slice(0,4);
  const mustRotateOut = allAlerts.filter(a => a.status === "cap").sort((a,b) => b.consecutivePlayedFull - a.consecutivePlayedFull);
  const avgForTier = (tier) => {
    const list = state.roster.filter(p => p.active && p.tier === tier);
    if (!list.length) return null;
    const total = list.reduce((acc,p) => acc + (state.matrix[p.name]||[]).reduce((a,v) => a + (v===1?1:0), 0), 0);
    return (total/list.length).toFixed(1);
  };
  const avgA = avgForTier("A"), avgB = avgForTier("B");

  const dim = (tier) => state.tierFilter !== "ALL" && state.tierFilter !== tier;
  const emph = (tier) => state.tierFilter !== "ALL" && state.tierFilter === tier;
  const genderColor = (tier) => tier === "A" ? "var(--amber)" : "var(--teal)";

  const upcomingTeams = getUpcomingTeams();

  let html = "";

  // Resumen
  html += `<div class="card" style="margin-bottom:20px">
    <div class="label">SUGERIDOS PARA LA PRÓXIMA FECHA</div>
    <div class="hint">Los 4 con más tiempo sin jugar, contemplando lo ya programado a futuro. No incluye a quien ya está al tope (ver abajo) ni a quien acaba de entrar sin historial.</div>
    ${suggestedNext.length === 0
      ? `<div style="font-size:13px;color:var(--dim)">No hay suficientes personas con historial para sugerir.</div>`
      : `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px">
          ${suggestedNext.map(a => `
            <span class="pill" style="border-color:var(--coral);opacity:${dim(a.tier)?0.35:1};box-shadow:${emph(a.tier)?`0 0 0 2px ${genderColor(a.tier)}`:"none"}">
              ${esc(a.name)} <span style="color:var(--coral);font-weight:700">· ${a.showsSincePlayedFull}</span>
            </span>`).join("")}
        </div>`}
    ${mustRotateOut.length > 0 ? `
      <div class="label" style="margin-top:16px">DEBEN ROTAR AFUERA</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${mustRotateOut.map(a => `
          <span class="pill" style="border-color:var(--amber);opacity:${dim(a.tier)?0.35:1};box-shadow:${emph(a.tier)?`0 0 0 2px ${genderColor(a.tier)}`:"none"}">
            ${esc(a.name)} <span style="color:var(--amber);font-weight:700">· ${a.consecutivePlayedFull} seguidas</span>
          </span>`).join("")}
      </div>` : ""}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      <div><div style="color:var(--dim);font-size:11px">Promedio por persona (año)</div><div style="font-weight:700">${avgPerPerson} shows</div></div>
      <div><div style="color:var(--dim);font-size:11px">Balance Hombres vs Mujeres</div>
        <div style="font-weight:700"><span style="color:var(--amber)">${avgA ?? "—"}</span> vs <span style="color:var(--teal)">${avgB ?? "—"}</span></div></div>
    </div>
  </div>`;

  // Barra mensual
  const maxMonthly = Math.max(1, ...monthlyData.map(d => d.value));
  html += `<div class="card" style="margin-bottom:20px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <span class="label" style="margin:0">VECES QUE JUGÓ — MES</span>
      <select data-action="set-selected-month" style="background:#2c2a31;color:var(--paper);border:none;border-radius:6px;padding:5px 10px;font-size:13px">
        ${months.map(m => `<option value="${m}" ${m===state.selectedMonth?"selected":""}>${monthLabel(m)}</option>`).join("")}
      </select>
    </div>
    ${renderHBar(monthlyData, maxMonthly, dim, emph, genderColor)}
  </div>`;

  // Barra anual
  const maxYearly = Math.max(1, ...yearData.map(d => d.value));
  html += `<div class="card" style="margin-bottom:20px">
    <div class="label">ACUMULADO 2026 — VECES QUE JUGÓ</div>
    ${renderHBar(yearData, maxYearly, dim, emph, genderColor)}
  </div>`;

  html += `<div style="font-size:11px;color:var(--dim);margin-bottom:20px">
    <span style="color:var(--amber)">■</span> Hombres &nbsp;&nbsp;<span style="color:var(--teal)">■</span> Mujeres
  </div>`;

  // Equipos programados
  if (upcomingTeams.length > 0) {
    html += `<div class="card" style="margin-bottom:20px">
      <div class="label">EQUIPOS PROGRAMADOS</div>
      <div class="hint">Quién ya está asignado a jugar en cada fecha futura, sin importar el mes.</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${upcomingTeams.map(t => `
          <div style="border-top:1px solid var(--line);padding-top:10px">
            <div style="font-size:12px;color:var(--amber);font-weight:700;margin-bottom:6px">${formatDate(t.date)}</div>
            ${t.playing.length === 0 ? `<div style="font-size:12px;color:var(--dim)">Todavía no hay nadie asignado a jugar.</div>` : `
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:${t.hosting.length?"6px":"0"}">
              ${t.playing.map(name => {
                const person = state.roster.find(r => r.name === name);
                const tier = person ? person.tier : "B";
                return `<span class="pill2" style="opacity:${dim(tier)?0.35:1};box-shadow:${emph(tier)?`0 0 0 2px ${genderColor(tier)}`:"none"}">${esc(name)}</span>`;
              }).join("")}
            </div>`}
            ${t.hosting.length > 0 ? `<div style="font-size:11px;color:var(--teal)">Host: ${t.hosting.map(esc).join(", ")}</div>` : ""}
          </div>`).join("")}
      </div>
    </div>`;
  }

  // Total del año + últimos 8 shows
  html += `<div class="card" style="margin-bottom:20px">
    <div class="label">TOTAL DEL AÑO + ÚLTIMOS 8 SHOWS</div>
    <div class="hint">El número es cuántas veces jugó en todo 2026 (incluye programadas a futuro). Los puntos son sus últimos 8 shows en el calendario, de izquierda (más viejo) a derecha (más reciente) — los programados se ven atenuados. Aquí el color de los puntos NO es género: es jugó/hosteó.</div>
    ${yearData.map(y => {
      const vals = state.matrix[y.name] || [];
      const start = Math.max(0, state.dates.length - 8);
      const lastEight = state.dates.slice(start).map((d,i) => ({ date: d, value: vals[start+i], isFuture: d > todaysStr }));
      const gd = dim(y.tier), ge = emph(y.tier);
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 6px;border-top:1px solid var(--line);font-size:14px;
        opacity:${gd?0.35:1};background:${ge?"#2c2a31":"transparent"};border-radius:${ge?"8px":"0"};
        box-shadow:${ge?`inset 3px 0 0 ${genderColor(y.tier)}`:"none"}">
        <span style="min-width:96px">${esc(y.name)}</span>
        <span style="display:flex;align-items:center;gap:10px">
          <span style="font-size:12px;font-weight:700;color:var(--paper);background:#2c2a31;border-radius:999px;padding:2px 8px;min-width:24px;text-align:center">${y.value}</span>
          <span style="display:flex;gap:3px">
            ${lastEight.map(s => `<span title="${s.date}${s.isFuture?" (programado)":""}" style="width:10px;height:10px;border-radius:999px;display:inline-block;
              background:${s.value===1?"var(--amber)":s.value===0?"var(--teal)":"#3a3840"};opacity:${s.isFuture?0.4:1};
              border:${s.isFuture && s.value!==null ? "1px dashed var(--ink)":"none"}"></span>`).join("")}
          </span>
        </span>
      </div>`;
    }).join("")}
    <div style="display:flex;gap:16px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--mute)">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--amber);border-radius:999px;margin-right:5px"></span>Jugó</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--teal);border-radius:999px;margin-right:5px"></span>Hosteó</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:#3a3840;border-radius:999px;margin-right:5px"></span>No estuvo</span>
    </div>
  </div>`;

  return html;
}

function renderHBar(data, max, dim, emph, genderColor) {
  return `<div style="display:flex;flex-direction:column;gap:8px">
    ${data.map(d => {
      const pct = Math.round((d.value / max) * 100);
      const isDim = dim(d.tier), isEmph = emph(d.tier);
      return `<div style="display:flex;align-items:center;gap:8px;opacity:${isDim?0.3:1}">
        <div style="width:78px;font-size:12px;color:var(--mute);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.name)}</div>
        <div style="flex:1;background:#25232a;border-radius:4px;height:18px;position:relative;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${d.tier==="A"?"var(--amber)":"var(--teal)"};border-radius:4px;
            ${isEmph?`box-shadow: inset 0 0 0 2px ${genderColor(d.tier)}`:""}"></div>
        </div>
        <div style="width:24px;font-size:12px;color:var(--paper);text-align:right;font-weight:700">${d.value}</div>
      </div>`;
    }).join("")}
  </div>`;
}

                const border = isUnavailable ? "2px solid var(--coral)" : (v===null||v===undefined ? "1px solid var(--line)" : "none");
                return `<div style="width:44px;height:${ROW_H}px;padding:2px;flex-shrink:0;box-sizing:border-box">
                  <div data-action="cycle-plan-cell" data-name="${esc(p.name)}" data-idx="${i}" title="${esc(p.name)} · ${d} · ${label}"
                    style="width:100%;height:100%;border-radius:5px;background:${bg};border:${border};box-sizing:border-box;cursor:pointer"></div>

    <div style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--dim)">

    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      ${!state.addingPlanDate ? `
        <button data-action="open-add-plan-date" style="background:#2c2a31;color:var(--paper);border:1px solid var(--amber);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px">＋ Agregar fecha</button>
      ` : `

          <input type="date" data-action="set-plan-new-date" value="${state.planNewDate}" style="background:#2c2a31;color:var(--paper);border:none;border-radius:6px;padding:8px 10px;font-size:14px">
          <button data-action="confirm-add-plan-date" ${!state.planNewDate?"disabled":""} style="background:${state.planNewDate?"var(--amber)":"#3a3840"};color:${state.planNewDate?"var(--ink)":"var(--dim)"};border:none;border-radius:6px;padding:8px 14px;font-weight:700;cursor:${state.planNewDate?"pointer":"not-allowed"}">Agregar</button>
          <button data-action="cancel-add-plan-date" style="background:transparent;color:var(--mute);border:1px solid #3a3840;border-radius:6px;padding:8px 14px;cursor:pointer">Cancelar</button>
        </div>
      `}
      <div style="font-size:11px;color:var(--dim);margin-top:8px">La fecha puede ser de cualquier mes — al agregarla, te lleva directo a verla aquí.</div>
    </div>
  </div>`;
  return html;
}

    <div style="min-width:480px">
      ${alerts.map(a => {
        const vals = state.matrix[a.name] || [];
        const monthsCols = getMonths().map(m => {
          const idxs = state.dates.map((d,i)=>({d,i})).filter(x => x.d.slice(0,7)===m && (vals[x.i]===1||vals[x.i]===0));

            <div style="display:flex;flex-direction:column-reverse;gap:1px;width:22px;min-height:8px;${isTapped?"padding:2px;border:1px solid var(--paper);border-radius:3px":""}">
              ${idxs.map(({i}) => `<div style="width:100%;height:8px;border-radius:2px;background:${vals[i]===1?"var(--amber)":"var(--teal)"}"></div>`).join("")}

          <div style="font-size:13px;font-weight:600;margin-bottom:6px">${esc(a.name)}</div>
          <div style="display:flex;align-items:flex-end;gap:10px;height:44px">${monthsCols}</div>

      <span><span style="display:inline-block;width:10px;height:10px;background:var(--teal);border-radius:2px;margin-right:5px"></span>Hosteó</span>

}

                  <div style="width:16px;height:16px;border-radius:3px;background:${bg};opacity:${isFuture?0.45:1};border:${isFuture && v!==null ? "1px dashed var(--ink)":"none"}"></div>

    <div style="display:flex;gap:16px;margin-top:16px;font-size:11px;color:var(--mute);flex-wrap:wrap">

      <span><span style="display:inline-block;width:10px;height:10px;background:var(--amber);opacity:0.45;border-radius:2px;margin-right:5px"></span>Planificado</span>
    </div>
  </div>`;
  return html;
}

/* =====================================================================
   RENDER — Alertas
   ===================================================================== */
function renderAlertas() {
  const alerts = computeAlertsList(getPerformers());
  const dueStrict = alerts.filter(a => a.status === "due");
  const dueToPlay = dueStrict.length >= 3 ? dueStrict : alerts.filter(a => a.status !== "new" && a.status !== "cap")
    .sort((a,b) => b.showsSincePlayedFull - a.showsSincePlayedFull).slice(0,3);
  const atCap = alerts.filter(a => a.status === "cap");
  const newcomers = alerts.filter(a => a.status === "new");
  const lastPastIdx = getLastPastIdx();

  let html = `<div class="card" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="font-size:13px;font-weight:700;color:var(--coral)">DEBEN JUGAR PRONTO (${dueToPlay.length})</span>
    </div>
    ${dueToPlay.length===0 ? `<div style="font-size:13px;color:var(--dim)">Nadie lleva 3+ shows sin jugar.</div>` :
      dueToPlay.map(a => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px">
        <span>${esc(a.name)} <span style="font-size:11px;color:var(--dim)">· ${genderLabel(a.tier)}</span></span>
        <span style="color:var(--coral);font-size:12px">${a.showsSincePlayedFull} shows sin jugar</span>
      </div>`).join("")}
  </div>`;

  html += `<div class="card" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="font-size:13px;font-weight:700;color:var(--amber)">AL TOPE — DEBEN ROTAR AFUERA (${atCap.length})</span>
    </div>
    ${atCap.length===0 ? `<div style="font-size:13px;color:var(--dim)">Nadie lleva 3+ shows seguidos jugando.</div>` :
      atCap.map(a => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px">
        <span>${esc(a.name)} <span style="font-size:11px;color:var(--dim)">· ${genderLabel(a.tier)}</span></span>
        <span style="color:var(--amber);font-size:12px">${a.consecutivePlayedFull} shows seguidos</span>
      </div>`).join("")}
  </div>`;

  if (newcomers.length > 0) {
    html += `<div class="card" style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="width:8px;height:8px;border-radius:999px;background:var(--gender-b);display:inline-block"></span>
        <span style="font-size:13px;font-weight:700;color:var(--gender-b)">NUEVOS — SIN HISTORIAL AÚN (${newcomers.length})</span>
      </div>
      <div class="hint" style="margin-bottom:8px">Se acaban de agregar y todavía no debutan (o solo tienen fechas programadas a futuro). No cuentan en "deben jugar pronto" para no sesgar los datos.</div>
      ${newcomers.map(a => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:14px">
        <span>${esc(a.name)} <span style="font-size:11px;color:var(--dim)">· ${genderLabel(a.tier)}</span></span>
      </div>`).join("")}
    </div>`;
  }

  html += `<div class="card">
    <div class="label">TODOS — ÚLTIMOS 8 SHOWS YA OCURRIDOS</div>
    <div class="hint">Cada punto es un show, de izquierda (más viejo) a derecha (más reciente). No incluye fechas futuras/planificadas.</div>
    ${alerts.map(a => {
      const vals = state.matrix[a.name] || [];
      const pastVals = vals.slice(0, lastPastIdx+1);
      const last8 = pastVals.slice(-8);
      const dotColor = a.status==="due"?"var(--coral)":a.status==="cap"?"var(--amber)":a.status==="new"?"var(--gender-b)":"var(--green)";
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px">
        <span style="display:flex;align-items:center;gap:8px;min-width:96px">
          <span style="width:8px;height:8px;border-radius:999px;flex-shrink:0;background:${dotColor};display:inline-block"></span>
          ${esc(a.name)}
        </span>
        <span style="display:flex;gap:3px">
          ${last8.map(v => `<span style="width:10px;height:10px;border-radius:999px;display:inline-block;background:${v===1?"var(--amber)":v===0?"var(--teal)":"#3a3840"}"></span>`).join("")}
        </span>
      </div>`;
    }).join("")}
  </div>`;

  return html;
}

/* =====================================================================
   RENDER — Disponibilidad
   ===================================================================== */
function renderDisponibilidad() {
  const active = state.roster.filter(p => p.active);
  let html = `<div class="card">
    <div class="label">DISPONIBILIDAD</div>
    <div class="hint">Elige una persona y marca sus fechas venideras. Toca para ciclar: sin responder → disponible → no disponible.</div>
    <div style="margin-bottom:16px">
      <label style="font-size:12px;color:var(--mute);display:block;margin-bottom:6px">Persona</label>
      <select data-action="set-avail-person" style="background:#2c2a31;color:var(--paper);border:none;border-radius:6px;padding:8px 10px;font-size:14px;width:100%">
        <option value="">Elige una persona…</option>
        ${active.map(p => `<option value="${esc(p.name)}" ${p.name===state.availPerson?"selected":""}>${esc(p.name)} (${genderLabel(p.tier)})</option>`).join("")}
      </select>
    </div>`;

  if (!state.availPerson) {
    html += `<div style="font-size:13px;color:var(--dim)">Elige una persona arriba para ver sus fechas venideras.</div></div>`;
    return html;
  }

  const t = todayStr();
  const upcoming = [...new Set([...state.dates.filter(d => d > t), ...Object.keys(state.availability).filter(d => d > t)])].sort();

  html += `<div style="display:flex;flex-direction:column;gap:6px;max-height:380px;overflow-y:auto;margin-bottom:14px">`;
  if (upcoming.length === 0) {
    html += `<div style="font-size:13px;color:var(--dim)">No hay fechas venideras todavía. Agrega una abajo.</div>`;
  }
  upcoming.forEach(d => {
    const st = (state.availability[d]||{})[state.availPerson];
    const color = st===true ? "var(--green)" : st===false ? "var(--coral)" : "#3a3840";
    const label = st===true ? "Disponible" : st===false ? "No disponible" : "Sin responder";
    const isShowDate = state.dates.includes(d);
    html += `<div data-action="cycle-availability" data-date="${d}" data-name="${esc(state.availPerson)}"
      style="display:flex;justify-content:space-between;align-items:center;background:#25232a;border:1px solid ${color};border-radius:8px;padding:10px 12px;cursor:pointer">
      <span style="font-size:14px">${formatDate(d)} ${!isShowDate ? `<span style="font-size:10px;color:var(--dim)"> · consulta</span>` : ""}</span>
      <span style="font-size:12px;font-weight:700;color:${color}">${label}</span>
    </div>`;
  });
  html += `</div>`;

  html += `<div style="padding-top:12px;border-top:1px solid var(--line)">
    <div class="hint" style="margin-bottom:8px">¿Preguntaste por una fecha que aún no está en el calendario? Agrégala aquí solo para consultar disponibilidad.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="date" data-action="set-avail-new-date" value="${state.availNewDate}" style="background:#2c2a31;color:var(--paper);border:none;border-radius:6px;padding:8px 10px;font-size:14px">
      <button data-action="confirm-avail-new-date" ${!state.availNewDate?"disabled":""} style="background:${state.availNewDate?"var(--amber)":"#3a3840"};color:${state.availNewDate?"var(--ink)":"var(--dim)"};border:none;border-radius:6px;padding:8px 14px;font-weight:700;cursor:${state.availNewDate?"pointer":"not-allowed"}">Agregar y marcar</button>
    </div>
  </div></div>`;

  return html;
}

/* =====================================================================
   RENDER — Elenco
   ===================================================================== */
function renderElenco() {
  let html = `<div class="card" style="margin-bottom:16px">
    <div class="label">AGREGAR PERSONA</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="text" placeholder="Nombre" data-action="set-new-name" value="${esc(state.newName)}" style="flex:1 1 140px;background:#2c2a31;color:var(--paper);border:none;border-radius:6px;padding:8px 10px;font-size:14px">
      <select data-action="set-new-tier" style="background:#2c2a31;color:var(--paper);border:none;border-radius:6px;padding:8px 10px;font-size:14px">
        <option value="A" ${state.newTier==="A"?"selected":""}>Hombre</option>
        <option value="B" ${state.newTier==="B"?"selected":""}>Mujer</option>
      </select>
      <button data-action="add-member" ${!state.newName.trim()?"disabled":""} style="background:${state.newName.trim()?"var(--amber)":"#3a3840"};color:${state.newName.trim()?"var(--ink)":"var(--dim)"};border:none;border-radius:6px;padding:8px 14px;font-weight:700;cursor:${state.newName.trim()?"pointer":"not-allowed"}">＋ Agregar</button>
    </div>
  </div>`;

  html += `<div class="card">
    <div class="label">ELENCO COMPLETO (${state.roster.length})</div>
    <div class="hint">"Inactivo" lo saca de gráficas y alertas, pero conserva su historial. Eliminar borra a la persona y sus datos por completo.</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${state.roster.map(p => `
        <div style="display:flex;justify-content:space-between;align-items:center;background:#25232a;border-radius:8px;padding:8px 12px;opacity:${p.active?1:0.5}">
          <span style="font-size:14px">${esc(p.name)} <span style="font-size:11px;color:var(--dim)">${genderLabel(p.tier)}</span></span>
          <span style="display:flex;gap:8px;align-items:center">
            <button data-action="toggle-gender" data-name="${esc(p.name)}" style="background:transparent;border:1px solid ${p.tier==="A"?"var(--amber)":"var(--teal)"};border-radius:6px;padding:4px 8px;cursor:pointer;color:${p.tier==="A"?"var(--amber)":"var(--teal)"};font-size:11px;font-weight:700">${genderLabel(p.tier)}</button>
            <button data-action="toggle-active" data-name="${esc(p.name)}" style="background:transparent;border:1px solid ${p.active?"var(--green)":"#3a3840"};border-radius:6px;padding:4px 8px;cursor:pointer;color:${p.active?"var(--green)":"var(--dim)"};font-size:11px;font-weight:700">${p.active?"Activo":"Inactivo"}</button>
            <button data-action="delete-member" data-name="${esc(p.name)}" style="background:transparent;border:none;cursor:pointer;color:var(--coral);padding:4px">🗑</button>
          </span>
        </div>`).join("")}
    </div>
  </div>`;

  return html;
}

/* =====================================================================
   RENDER PRINCIPAL
   ===================================================================== */
function render() {
  const app = document.getElementById("app");
  if (!state.loaded) {
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--paper)">Cargando…</div>`;
    return;
  }

  const tabs = ["dashboard","planificar mes","por mes","año completo","alertas","disponibilidad","elenco"];

  let body = "";
  if (state.tab === "dashboard") body = renderDashboard();
  else if (state.tab === "planificar mes") body = renderPlanificarMes();
  else if (state.tab === "por mes") body = renderPorMes();
  else if (state.tab === "año completo") body = renderAnoCompleto();
  else if (state.tab === "alertas") body = renderAlertas();
  else if (state.tab === "disponibilidad") body = renderDisponibilidad();
  else if (state.tab === "elenco") body = renderElenco();

  const showFilter = state.tab !== "elenco" && state.tab !== "planificar mes";

  app.innerHTML = `
    <style>
      .card { background: var(--card); border-radius: 12px; padding: 16px; }
      .label { font-size: 13px; color: var(--mute); font-weight: 600; margin-bottom: 4px; }
      .hint { font-size: 11px; color: var(--dim); margin-bottom: 14px; }
      .pill { background:#2c2a31; border:1px solid; border-radius:999px; padding:5px 12px; font-size:13px; font-weight:600; color:var(--paper); display:inline-block; transition: opacity .15s, box-shadow .15s; }
      .pill2 { background:#2c2a31; border-radius:999px; padding:4px 10px; font-size:12px; color:var(--paper); display:inline-block; transition: opacity .15s, box-shadow .15s; }
      .iconbtn { background:#2c2a31; color:var(--paper); border:none; border-radius:6px; width:26px; height:26px; cursor:pointer; }
      .iconbtn:disabled { color:#5a5762; cursor:default; }
      .tabbtn { border-radius:999px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid #3a3840; background:transparent; color:var(--paper); text-transform:capitalize; }
      .tabbtn.active { background:var(--amber); color:var(--ink); border-color:var(--amber); }
      .filterbtn { background:transparent; color:var(--mute); border:1px solid var(--line); border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; }
      .filterbtn.active { background:#2c2a31; color:var(--amber); }
    </style>
    <div style="min-height:100vh">
      <div style="border-bottom:1px solid var(--line); padding:20px 20px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <h1 class="marquee" style="font-size:28px;margin:0;color:var(--amber);text-transform:uppercase">Rotación de Elenco</h1>
          <div style="display:flex;align-items:center;gap:12px">
            <div style="display:flex;gap:6px">
              <button data-action="undo" ${state.history.length===0?"disabled":""} style="display:flex;align-items:center;gap:4px;background:#2c2a31;border:none;border-radius:6px;padding:5px 9px;font-size:11px;font-weight:600;color:${state.history.length===0?"#5a5762":"var(--paper)"};cursor:${state.history.length===0?"default":"pointer"}">↶ Deshacer</button>
              <button data-action="redo" ${state.future.length===0?"disabled":""} style="display:flex;align-items:center;gap:4px;background:#2c2a31;border:none;border-radius:6px;padding:5px 9px;font-size:11px;font-weight:600;color:${state.future.length===0?"#5a5762":"var(--paper)"};cursor:${state.future.length===0?"default":"pointer"}">↷ Rehacer</button>
            </div>
            <span style="font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px">
              Si Y Nighters
              ${state.saveStatus==="saving" ? `<span style="color:var(--amber)">· Guardando…</span>` : ""}
              ${state.saveStatus==="saved" ? `<span style="color:var(--green)">· Guardado ✓</span>` : ""}
              ${state.saveStatus==="error" ? `<span style="color:var(--coral)">· Error al guardar, reintenta</span>` : ""}
            </span>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
          ${tabs.map(t => `<button data-action="set-tab" data-tab="${t}" class="tabbtn ${state.tab===t?"active":""}">${t}</button>`).join("")}
        </div>
      </div>
      <div style="padding:20px;max-width:720px;margin:0 auto">
        ${showFilter ? `
        <div style="display:flex;gap:8px;margin-bottom:20px">
          <button data-action="set-tier-filter" data-tier="ALL" class="filterbtn ${state.tierFilter==="ALL"?"active":""}">Todos</button>
          <button data-action="set-tier-filter" data-tier="A" class="filterbtn ${state.tierFilter==="A"?"active":""}">Hombres</button>
          <button data-action="set-tier-filter" data-tier="B" class="filterbtn ${state.tierFilter==="B"?"active":""}">Mujeres</button>
        </div>` : ""}
        ${state.loadError ? `<div style="background:#3a2622;border:1px solid var(--coral);border-radius:8px;padding:10px 12px;margin-bottom:16px;font-size:12px;color:var(--coral)">
          No se pudo conectar con GitHub: ${esc(state.loadError)}. Revisa el token y el repo en la configuración del archivo. Mientras tanto, estás viendo datos de respaldo (no se guardarán cambios).
        </div>` : ""}
        ${body}
      </div>
    </div>
  `;
}

/* =====================================================================
   EVENTOS (delegación)
   ===================================================================== */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  switch (action) {
    case "set-tab": state.tab = el.dataset.tab; render(); break;
    case "set-tier-filter": state.tierFilter = el.dataset.tier; render(); break;
    case "undo": undo(); break;
    case "redo": redo(); break;
    case "plan-month-prev": { const ms = getMonths(); const i = ms.indexOf(state.selectedMonth); if (i>0) { state.selectedMonth = ms[i-1]; render(); } break; }
    case "plan-month-next": { const ms = getMonths(); const i = ms.indexOf(state.selectedMonth); if (i<ms.length-1) { state.selectedMonth = ms[i+1]; render(); } break; }
    case "delete-date": deleteDate(el.dataset.date); break;
    case "cycle-plan-cell": cyclePlanCell(el.dataset.name, parseInt(el.dataset.idx,10)); break;
    case "open-add-plan-date": state.addingPlanDate = true; render(); break;
    case "cancel-add-plan-date": state.addingPlanDate = false; state.planNewDate = ""; render(); break;
    case "confirm-add-plan-date": addPlanDate(); render(); break;
    case "tap-bar": {
      const name = el.dataset.name, month = el.dataset.month;
      if (state.tappedBar && state.tappedBar.name===name && state.tappedBar.month===month) state.tappedBar = null;
      else state.tappedBar = { name, month };
      render();
      break;
    }
    case "cycle-availability": cycleAvailability(el.dataset.date, el.dataset.name); break;
    case "confirm-avail-new-date": {
      if (state.availNewDate && state.availPerson) { cycleAvailability(state.availNewDate, state.availPerson); state.availNewDate = ""; render(); }
      break;
    }
    case "toggle-gender": toggleGender(el.dataset.name); break;
    case "toggle-active": toggleActive(el.dataset.name); break;
    case "delete-member": deleteMember(el.dataset.name); break;
    case "add-member": addMember(); render(); break;
  }
});

document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  switch (action) {
    case "set-selected-month": state.selectedMonth = el.value; render(); break;
    case "set-target-cast": state.targetCastSize = parseInt(el.value,10) || 1; render(); break;
    case "set-plan-new-date": state.planNewDate = el.value; render(); break;
    case "set-avail-person": state.availPerson = el.value; render(); break;
    case "set-avail-new-date": state.availNewDate = el.value; render(); break;
    case "set-new-tier": state.newTier = el.value; render(); break;
  }
});

document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (el.dataset.action === "set-new-name") { state.newName = el.value; }
});

init();
</script>
</body>
</html>
